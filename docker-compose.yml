services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ./qdrant:/qdrant/storage
    ports:
      - "${QDRANT_HOST_PORT:-6334}:6333"
    networks:
      - homelab_stack
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    networks:
      - homelab_stack
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    networks:
      - homelab_stack
    depends_on:
      - backend
    restart: unless-stopped

networks:
  homelab_stack:
    external: true

